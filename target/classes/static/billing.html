<!DOCTYPE html>
<html>
<head>
<title>Billing Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= CUSTOMER DETAILS ================= -->

<h3>Customer Details</h3>

<label>Customer Name:</label>
<input type="text" id="customerName" placeholder="Enter Customer Name">

<label>Invoice Number:</label>
<input type="text" id="invoiceNumber" readonly>

<label>Date & Time:</label>
<input type="datetime-local" id="invoiceDate">

<hr>

<!-- ================= BILLING SYSTEM ================= -->

<h2>Billing System</h2>

<input type="text" id="itemName" placeholder="Item Name">
<input type="number" id="price" placeholder="Price">
<input type="number" id="quantity" placeholder="Quantity">

<button onclick="addBill()">Add Item</button>

<h2>Items</h2>

<table border="1" width="100%">
<thead>
<tr>
<th>ID</th>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>

<tbody id="billTable"></tbody>

</table>

<!-- ================= GRAND TOTAL ================= -->

<h2 style="text-align:right; margin-top:20px;">
Grand Total: <span id="grandTotal">₹ 0</span>
</h2>

<!-- ================= PRINT BUTTON ================= -->

<button onclick="printBill()" style="
padding:10px 20px;
background-color:green;
color:white;
border:none;
cursor:pointer;
float:right;
margin-top:10px;
">
Print Bill
</button>

<!-- ================= JAVASCRIPT ================= -->

<script>

////////////////////////////////////////
// GENERATE INVOICE NUMBER
////////////////////////////////////////

function generateInvoice(){

let invoice = "INV" + Math.floor(Math.random()*100000);

document.getElementById("invoiceNumber").value = invoice;

}

////////////////////////////////////////
// SET CURRENT DATE
////////////////////////////////////////

function setCurrentDate(){

let now = new Date();

let formatted = now.toISOString().slice(0,16);

document.getElementById("invoiceDate").value = formatted;

}

////////////////////////////////////////
// ADD BILL
////////////////////////////////////////

function addBill(){

let itemName = document.getElementById("itemName").value;
let price = document.getElementById("price").value;
let quantity = document.getElementById("quantity").value;

fetch(`http://localhost:8080/bills/add?itemName=${itemName}&price=${price}&quantity=${quantity}`)
.then(res => res.json())
.then(data => {

loadBills();
loadTotal();

});

}

////////////////////////////////////////
// LOAD ALL BILLS
////////////////////////////////////////

function loadBills(){

fetch("http://localhost:8080/bills/all")
.then(res => res.json())
.then(data => {

let table = "";

data.forEach(bill => {

table += `
<tr>
<td>${bill.id}</td>
<td>${bill.itemName}</td>
<td>${bill.price}</td>
<td>${bill.quantity}</td>
<td>${bill.total}</td>
<td>
<button onclick="deleteBill(${bill.id})">Delete</button>
</td>
</tr>
`;

});

document.getElementById("billTable").innerHTML = table;

});

}

////////////////////////////////////////
// LOAD GRAND TOTAL
////////////////////////////////////////

function loadTotal(){

fetch("http://localhost:8080/bills/total")
.then(res => res.text())
.then(total => {

document.getElementById("grandTotal").innerHTML =
 + total;

});

}

////////////////////////////////////////
// DELETE BILL
////////////////////////////////////////

function deleteBill(id){

let confirmDelete = confirm("Are you sure you want to delete this item?");

if(confirmDelete){

fetch(`http://localhost:8080/bills/delete?id=${id}`)
.then(res=>res.text())
.then(msg=>{

alert("Item deleted successfully");

loadBills();
loadTotal();

});

}

}

////////////////////////////////////////
// PRINT BILL
////////////////////////////////////////

function printBill(){

let customer = document.getElementById("customerName").value;
let invoice = document.getElementById("invoiceNumber").value;
let date = document.getElementById("invoiceDate").value;
let total = document.getElementById("grandTotal").innerText;
let items = document.getElementById("billTable").innerHTML;

let printWindow = window.open('', '', 'width=800,height=600');

printWindow.document.write(`
<html>
<head>
<title>Invoice</title>
<style>
body { font-family: Arial; padding:20px; }
table { width:100%; border-collapse: collapse; }
th, td { border:1px solid black; padding:8px; }
h2 { text-align:center; }
</style>
</head>

<body>

<h2>Billing Invoice</h2>

<p><b>Customer:</b> ${customer}</p>
<p><b>Invoice No:</b> ${invoice}</p>
<p><b>Date:</b> ${date}</p>

<table>
<tr>
<th>ID</th>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>

${items}

</table>

<h3 style="text-align:right;">Grand Total: ${total}</h3>

</body>
</html>
`);

printWindow.document.close();
printWindow.print();

}

////////////////////////////////////////
// LOAD ON PAGE START
////////////////////////////////////////

generateInvoice();
setCurrentDate();
loadBills();
loadTotal();

</script>

</body>
</html>
